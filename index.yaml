plugins:
  - id: evaluation-rubrics
    path: plugins/evaluation-rubrics
    display_name: Evaluation Rubrics
    description: >
      Tools for designing analytic grading rubrics and evaluating student
      or group assignment submissions with cumulative grade tracking.
    version: 1.0.2
    skills:
      - rubric-creator
      - assignment-evaluator
  - id: exam-creator
    path: plugins/exam-creator
    display_name: Exam Creator
    description: >
      Tools for generating multiple-choice exams from course content.
      Produces structured JSON exam files ready to be imported into any
      exam delivery system.
    version: 1.0.0
    skills:
      - mcq-generator
  - id: pdds
    path: plugins/pdds
    display_name: PDDS
    description: >
      Tools for the PDDS (Optimizaciones y Desempeño) course. Converts teacher
      demo guides into student-facing READMEs, and builds step-by-step reference
      solution repositories for student assignments.
    version: 1.0.0
    skills:
      - pdds-student-guide
      - pdds-assignment-solutioner
  - id: pdds-oyd
    path: plugins/pdds-oyd
    display_name: PDDS — Optimizaciones y Desempeño
    description: >
      Course-specific tools for PDDS "Optimizaciones y Desempeño / Cloud Deployment
      Automation" at FISICC, Universidad Galileo. Builds graded project delivery
      documents and rubrics (5-delivery arc), and generates full session instructional
      materials (demo scripts, exercise DOCX files, PPTX decks, and code example zips).
    version: 1.2.0
    skills:
      - pdds-delivery-builder
      - pdds-session-builder
