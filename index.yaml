plugins:
  - id: evaluation-rubrics
    path: plugins/evaluation-rubrics
    display_name: Evaluation Rubrics
    description: >
      Tools for designing analytic grading rubrics and evaluating student
      or group assignment submissions with cumulative grade tracking.
    version: 1.0.2
    skills:
      - rubric-creator
      - assignment-evaluator
  - id: exam-creator
    path: plugins/exam-creator
    display_name: Exam Creator
    description: >
      Tools for generating multiple-choice exams from course content.
      Produces structured JSON exam files ready to be imported into any
      exam delivery system.
    version: 1.2.0
    skills:
      - mcq-generator
      - exam-version-generator
      - gdocs-exam-exporter
  - id: pdds-oyd
    path: plugins/pdds-oyd
    display_name: PDDS — OyD (Optimizaciones y Desempeño)
    description: >
      Tools for the OyD (Optimizaciones y Desempeño / Cloud Deployment Automation) course
      in the PDDS program at FISICC, Universidad Galileo. Builds graded project delivery
      documents and rubrics (5-delivery arc), generates full session instructional materials
      (demo scripts, exercise Google Docs, Google Slides decks, and code example zips),
      converts teacher demo guides into student-facing READMEs, and builds step-by-step
      reference solution repositories for student assignments.
    version: 2.3.0
    skills:
      - pdds-oyd-delivery-builder
      - pdds-oyd-session-builder
      - pdds-oyd-student-guide
      - pdds-oyd-assignment-solutioner
  - id: google-drive-creation
    path: plugins/google-drive-creation
    display_name: Google Drive Creation
    description: >
      General-purpose tools for creating styled Google Docs and Google Slides via
      the Google Docs and Slides APIs. Handles named paragraph styles, code blocks,
      bullet and numbered lists, and inline formatting for Docs; and all PDDS slide
      types for Slides. Designed to be called by other skills.
    version: 1.4.0
    skills:
      - gdoc-creator
      - gslides-creator
