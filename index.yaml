plugins:
  - id: course-factory
    path: plugins/course-factory
    display_name: Course Factory
    description: >
      Course-agnostic harness for producing university course material with
      Claude Code. A bootstrap skill interviews the instructor and scaffolds a
      per-course harness (course.yaml config, protocol, conductor guide, shared
      context, handover templates, folder scaffold); generalized artifact skills
      then produce the material one session, one artifact at a time — session
      plans, instructor example packs, class exercises, slides (local HTML build
      + PDF), labs, exams, homework, readings, project deliveries, presentation
      guides, Miro boards, and Google Doc publishing. Course specifics live in
      the course folder's course.yaml, read at runtime.
    version: 1.0.0
    skills:
      - course-bootstrap
      - session-planning
      - examples
      - class-exercises
      - slides
      - publish-google-doc
      - lab
      - exam
      - practical-exam
      - homework
      - readings
      - project-delivery
      - presentation-guide
      - recap-signup
      - publish-course-docs
      - miro-boards
      - student-guide
      - assignment-solutioner
  - id: evaluation-rubrics
    path: plugins/evaluation-rubrics
    display_name: Evaluation Rubrics
    description: >
      Tools for designing analytic grading rubrics and evaluating student
      or group assignment submissions with cumulative grade tracking.
    version: 1.2.0
    skills:
      - rubric-creator
      - assignment-evaluator
  - id: exam-creator
    path: plugins/exam-creator
    display_name: Exam Creator
    description: >
      Tools for generating multiple-choice exams from course content.
      Produces structured JSON exam files ready to be imported into any
      exam delivery system.
    version: 1.2.0
    skills:
      - mcq-generator
      - exam-version-generator
      - gdocs-exam-exporter
  - id: google-drive-creation
    path: plugins/google-drive-creation
    display_name: Google Drive Creation
    description: >
      General-purpose tools for creating styled Google Docs and Google Slides via
      the Google Docs and Slides APIs. Handles named paragraph styles, code blocks,
      bullet and numbered lists, and inline formatting for Docs; and all PDDS slide
      types for Slides. Designed to be called by other skills.
    version: 1.4.0
    skills:
      - gdoc-creator
      - gslides-creator
