name: google-drive-creation
display_name: Google Drive Creation
description: >
  General-purpose tools for creating styled Google Docs and Google Slides via
  the Google Docs and Google Slides APIs. Handles named paragraph styles, code
  blocks, bullet and numbered lists, inline formatting spans, and tables for
  Docs; and all PDDS slide types (title, agenda, section divider, content, demo
  marker, step, callout, exercise, code) for Slides.
  Designed to be called by other skills that produce document or presentation content.
version: 1.4.0
skills:
  - id: gdoc-creator
    path: skills/gdoc-creator
  - id: gslides-creator
    path: skills/gslides-creator
commands: []
mcp_servers: []
