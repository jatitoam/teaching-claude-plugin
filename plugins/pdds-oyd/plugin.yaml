name: pdds-oyd
display_name: PDDS — OyD (Optimizaciones y Desempeño)
description: >
  Tools for the OyD (Optimizaciones y Desempeño / Cloud Deployment Automation) course
  in the PDDS program at FISICC, Universidad Galileo. Builds graded project delivery
  documents and rubrics (5-delivery arc), generates full session instructional materials
  (demo scripts, exercise Google Docs, Google Slides decks, and code example zips),
  converts teacher demo guides into student-facing READMEs, and builds step-by-step
  reference solution repositories for student assignments.
version: 2.2.1
skills:
  - id: pdds-oyd-delivery-builder
    path: skills/pdds-oyd-delivery-builder
  - id: pdds-oyd-session-builder
    path: skills/pdds-oyd-session-builder
  - id: pdds-oyd-student-guide
    path: skills/pdds-oyd-student-guide
  - id: pdds-oyd-assignment-solutioner
    path: skills/pdds-oyd-assignment-solutioner
commands: []
mcp_servers: []
