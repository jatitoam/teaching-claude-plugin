name: evaluation-rubrics
display_name: Evaluation Rubrics
description: >
  Tools for designing analytic grading rubrics and evaluating student or group
  assignment submissions. Includes rubric generation from assignment descriptions
  and automated scoring against existing rubrics with cumulative grade tracking.
  Video submissions (YouTube or local files) are graded from an auditable
  evidence pack of timestamped frames, transcript, and metadata.
version: 1.6.0
skills:
  - id: rubric-creator
    path: skills/rubric-creator
  - id: assignment-evaluator
    path: skills/assignment-evaluator
  - id: build-grades
    path: skills/build-grades
  - id: video-evidence
    path: skills/video-evidence
commands:
  - id: install-video-deps
    path: commands/install-video-deps.md
mcp_servers: []
